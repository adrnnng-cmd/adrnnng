name: Notify host

# Tells the host to redeploy https://adrnnng.com after every push to main.
# Also callable from other workflows, because pushes made with GITHUB_TOKEN
# (e.g. the scheduled data refresh) do not trigger `on: push`.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
    secrets:
      GROKBOT_WEBHOOK_URL:
        required: true
      GROKBOT_WEBHOOK_KEY:
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: POST publish ping
        env:
          WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROKBOT_WEBHOOK_KEY }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_KEY" ]; then
            echo "::error::GROKBOT_WEBHOOK_URL / GROKBOT_WEBHOOK_KEY secrets are not set"
            exit 1
          fi
          body=$(printf '{"repo":"adrnnng","sha":"%s"}' "$SHA")
          ping() {
            curl -sS --retry 2 --retry-all-errors --max-time 30 -o /tmp/resp -w '%{http_code}' \
              -X POST "$WEBHOOK_URL" \
              -H "Authorization: $1" \
              -H "Content-Type: application/json" \
              --data "$body" || echo 000
          }
          # The host expects "Authorization: Bearer <key>". Tolerate a stored value that
          # carries whitespace/newlines or an "Authorization:" / "Bearer" prefix.
          key=$(printf '%s' "$WEBHOOK_KEY" | tr -d '\r\n' | sed -E 's/^[[:space:]]*([Aa]uthorization:)?[[:space:]]*([Bb]earer[[:space:]]+)?//; s/[[:space:]]+$//')
          echo "::add-mask::$key"
          code=$(ping "Bearer $key")
          echo "host replied HTTP $code: $(head -c 300 /tmp/resp)"
          case "$code" in 2??) echo "pinged host for $SHA" ;; *) echo "::error::publish ping failed (HTTP $code)"; exit 1 ;; esac

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: "22"

      # Best-effort. The host deploy is asynchronous, so a ping here can run
      # before the new key file is live. publish.sh should ping again after
      # `wrangler pages deploy` (see scripts/ping-indexnow.mjs).
      - name: Ping IndexNow
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [ ! -f scripts/ping-indexnow.mjs ]; then
            echo "indexnow script not in this checkout"
            exit 0
          fi
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE" "$SHA" > /tmp/changed.txt
          elif git rev-parse --verify "${SHA}^" >/dev/null 2>&1; then
            git diff --name-only "${SHA}^" "$SHA" > /tmp/changed.txt
          else
            git show --pretty= --name-only --format= "$SHA" > /tmp/changed.txt
          fi
          node scripts/ping-indexnow.mjs --paths /tmp/changed.txt --retries 3 --retry-delay-ms 20000
