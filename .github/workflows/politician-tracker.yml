name: Politician Tracker refresh

# Rebuilds politician-tracker/{index.html,data.json} from free public sources
# and commits the result. Only that folder is ever staged.
on:
  schedule:
    - cron: "5 23 * * 0-5" # 07:05 HKT, Monday–Saturday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: politician-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        env:
          PYTHONPATH: .github/politician-tracker
        run: |
          python -m tracker build --out . \
            || echo "::warning::all trade sources failed; page kept previous rows and shows a stale notice"

      - name: Commit
        id: commit
        run: |
          git config user.name "politician-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add politician-tracker
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "politician-tracker: data refresh $(TZ=Asia/Hong_Kong date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  notify:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/notify-host.yml
    with:
      sha: ${{ needs.build.outputs.sha }}
    secrets: inherit
