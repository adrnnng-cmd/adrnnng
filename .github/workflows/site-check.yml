name: Site check

# The site has no build step; this is its "build": unit tests, the backtest reference
# cross-check on real data, and structural checks of the tool registry and pages.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: npm test
      - name: Backtest engine vs independent reference (SPY)
        run: npm run verify:backtest
      - name: Registry, pages and links
        run: npm run check
