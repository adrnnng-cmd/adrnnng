name: Backtest prices refresh

# Downloads daily OHLCV + dividends/splits for the Backtest universe from Yahoo Finance and
# commits backtest/data/prices/. Only that folder is ever staged.

on:
  schedule:
    - cron: "30 22 * * 1-5" # 06:30 HKT Tue–Sat, after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        env:
          PYTHONPATH: .github/backtest
        run: python -m prices fetch --out .

      - name: Commit
        id: commit
        run: |
          git config user.name "backtest-prices[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/data/prices
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "backtest: price refresh $(TZ=Asia/Hong_Kong date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  notify:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/notify-host.yml
    with:
      sha: ${{ needs.build.outputs.sha }}
    secrets: inherit
